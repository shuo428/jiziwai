# 数据库配置 (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5433/jiziwai
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

#下面这些内容是为了让MyBatis映射
#指定Mybatis的Mapper文件
mybatis.mapper-locations=classpath:mappers/*xml
#指定Mybatis的实体目录
mybatis.type-aliases-package=springbootjni.entity
# MyBatis 配置
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# 应用服务 WEB 访问端口
server.port=8080
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Sa-Token 配置
sa-token.token-name=Authorization
sa-token.timeout=2592000
sa-token.activity-timeout=-1
sa-token.is-concurrent=true
sa-token.is-share=true
sa-token.token-style=uuid
sa-token.is-log=false
sa-token.is-read-cookie=false
sa-token.is-read-head=true
sa-token.jwt-secret-key=abccefghijklmnopqas1uvwxyz

# 光谱图像文件存储目录。数据库只保存相对于该目录的路径。
# 不放在 springboot-jni 代码目录下，避免 RAW/PNG 图像文件混入源码工程。
# 当前目录与 jiziwai、SpectraBridge 同级。
spectral.storage.root=D:/GraduationProject/spectral-images

# 单次触发后等待完整图像的最长时间。超时后后端写入TIMEOUT记录并关闭当前桥接连接，
# 避免没有frameId时“上一轮迟到图片”被误认为下一轮采集结果。
spectral.capture.timeout-ms=15000
